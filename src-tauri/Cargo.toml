[package]
name = "cc-switch-lite"
version = "0.1.0-alpha.1"
description = "A provider configuration editor for CC Switch applications"
license = "MIT"
repository = "https://github.com/SaladDay/cc-switch-lite"
edition = "2021"
rust-version = "1.88"

[lib]
name = "cc_switch_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
base64 = "0.22"
cc-switch-core = { git = "https://github.com/SaladDay/cc-switch-core", rev = "a445112c4f844a357a8aac561efa007010e6ac0a" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "std", "zeroize"] }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
futures-util = "0.3"
hmac = "0.12"
json5 = "0.4"
json-five = "0.3.1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2.8.2", features = [] }
thiserror = "2.0"
toml_edit = "0.25"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
wasmtime = { version = "=36.0.14", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3.21"
