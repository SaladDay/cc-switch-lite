[package]
name = "cc-switch-lite"
version = "0.1.0-alpha.1"
description = "A provider configuration editor for CC Switch applications"
license = "MIT"
repository = "https://github.com/SaladDay/cc-switch-lite"
edition = "2021"
rust-version = "1.88"

[lib]
name = "cc_switch_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
cc-switch-core = { git = "https://github.com/SaladDay/cc-switch-core", rev = "06011ab42e1b2f932847635c0144b646182dad8d" }
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
hmac = "0.12"
json5 = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2.8.2", features = [] }
thiserror = "2.0"
toml_edit = "0.25"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.21"
